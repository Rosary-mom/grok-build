# Example patterns — merge into your sandbox / permission deny configuration.
# Exact keys depend on your installed version; see user-guide 18-sandbox.md and
# 22-permissions-and-safety.md. Intent: keep credentials out of agent reach.

# Suggested deny globs (illustrative):
# **/*.pem
# **/*.p12
# **/*id_rsa*
# **/.env
# **/.env.*
# **/credentials.json
# **/secrets/**
# **/*service-account*.json

# Prefer Never Allow for destructive shells (rm -rf, format, diskpart, etc.).
# Expand full bash bodies (Ctrl-F) before approving long scripts.
